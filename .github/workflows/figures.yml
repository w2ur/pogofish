name: figures

# docs/experiments/v5 and v3-solve are the committed sources figures/scripts/pack-v5.mjs and
# table-extract.mjs read, and that figures/src/data.test.ts checks the packed files against.
on:
  push:
    paths: ["figures/**", "wasm-pkg/**", "crates/**", "docs/experiments/v5/**", "docs/experiments/v3-solve/**", ".github/workflows/figures.yml"]
  pull_request:
    paths: ["figures/**", "wasm-pkg/**", "crates/**", "docs/experiments/v5/**", "docs/experiments/v3-solve/**", ".github/workflows/figures.yml"]

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the round-5 charts' date is curves.json's commit date, and a
          # shallow clone only knows HEAD's (figures/scripts/v5-date.mjs refuses it).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # No pogofish-train: it downloads libtorch, which release-cli.yml also avoids.
      - name: Rust tests
        run: cargo test --release -p pogofish-engine -p pogofish-search -p pogofish-infer -p pogofish-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: figures/package-lock.json
      - name: Install
        working-directory: figures
        run: npm ci
      - name: Test
        working-directory: figures
        run: npm test
      - name: Build
        working-directory: figures
        run: npm run build
      - name: Build assertions (worker entry, nothing inlined, no dist/assets/)
        working-directory: figures
        run: ./scripts/check-dist.sh
