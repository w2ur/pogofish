# Plan task 6.3: release binaries of the terminal game.
# Runs only when a tag like `cli-v0.1.0` is pushed; nothing runs on branches.
name: release-cli

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14        # Apple silicon
            target: aarch64-apple-darwin
          # GitHub retired the macos-13 Intel image (2025): cross-compile on
          # Apple silicon; the x86_64 tests and binary run under Rosetta 2.
          - runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The terminal game needs no libtorch: only its own crates are built.
      # Tests are built for the release target, so each job tests the
      # architecture it ships (including a full game against the bundled net).
      - name: Test
        run: cargo test --release --target ${{ matrix.target }} -p pogofish-engine -p pogofish-infer -p pogofish-cli
      - name: Build
        run: cargo build --release -p pogofish-cli --target ${{ matrix.target }}
      - name: Run the shipped binary
        run: target/${{ matrix.target }}/release/pogofish --help
      - name: Package
        run: |
          dir=pogofish-${GITHUB_REF_NAME#cli-}-${{ matrix.target }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/pogofish "$dir/"
          cp README.md docs/rules.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pogofish-*.tar.gz
            pogofish-*.tar.gz.sha256
