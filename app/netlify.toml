[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Install Playwright's Chromium into node_modules so Netlify's build cache
  # keeps it across deploys (the postbuild prerender step drives the real build
  # in headless Chromium — see app/scripts/prerender.mjs).
  PLAYWRIGHT_BROWSERS_PATH = "0"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# French is prerendered to /fr/index.html — these must precede the SPA catch-all.
[[redirects]]
  from = "/fr"
  to = "/fr/index.html"
  status = 200

[[redirects]]
  from = "/fr/*"
  to = "/fr/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
