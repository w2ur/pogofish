    <!-- First-visit language redirect: send a French browser (or an explicit
         stored French choice) from the x-default root to /fr before anything
         paints. Runs only at "/", and never overrides an explicit English
         choice. Per-language documents are emitted by scripts/prerender.mjs. -->
    <script>
      (function () {
        try {
          if (location.pathname !== "/") return;
          var stored = localStorage.getItem("pogofish.lang");
          var wantFr = stored
            ? stored === "fr"
            : (navigator.language || "").toLowerCase().indexOf("fr") === 0;
          if (wantFr) location.replace("/fr/" + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
