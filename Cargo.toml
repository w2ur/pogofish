[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/search",
    "crates/train",
    "crates/cli",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
authors = ["William Revah"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
