<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pogo-figures · export</title>
    <link rel="icon" href="data:," />
    <!--
      Dev only (npm run dev); never part of dist/. One figure, in export mode
      (src/kit/export.ts), on the light page tokens, for a capture script
      (tools/article-visuals/figures-export.mjs):
      ?tag=pogo-line&attrs={"line":"loop"}&width=672&lang=fr
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
    />
    <style>
      /* The host page's half of the contract, light: the DESIGN.md token table. */
      :root {
        --pogo-ground: #eff1f2;
        --pogo-ink: #0a0a0a;
        --pogo-ink-2: #34373a;
        --pogo-muted: #565a5e;
        --pogo-rule: #c3c7ca;
        --pogo-edge: #7e8388;
        --pogo-red: #ff3b1f;
        --pogo-red-text: #c4200a;
        --pogo-white: #ffffff;
        --pogo-on-red: #0a0a0a;
        --pogo-action: #0a0a0a;
        --pogo-font: Archivo, system-ui, sans-serif;
        --pogo-font-display: Archivo, system-ui, sans-serif;
        background: var(--pogo-ground);
        color: var(--pogo-ink);
        font-family: var(--pogo-font);
      }
      body {
        margin: 0;
      }
      /* The picture: the figure at the width asked, on the ground, with the same margin all round. */
      #shot {
        display: inline-block;
        padding: var(--pad, 24px);
        background: var(--pogo-ground);
      }
      #shot > * {
        display: block;
        width: var(--width, 672px);
      }
    </style>
  </head>
  <body>
    <div id="shot"></div>
    <script type="module" src="./export.ts"></script>
  </body>
</html>
